app:
  name: Medora AI Chatbot v2 Classifier
  description: Dedicated multilingual structured classifier for CRM-owned chatbot v2 turns.
  mode: advanced-chat
  icon: 🧭
  icon_background: '#E7F1FF'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-classifier-llm
      source: start
      sourceHandle: source
      target: classifier_llm
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: classifier-normalize
      source: classifier_llm
      sourceHandle: source
      target: normalize_classifier_output
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: normalize-final
      source: normalize_classifier_output
      sourceHandle: source
      target: final_answer
      targetHandle: target
      type: custom
      data:
        sourceType: code
        targetType: answer
        isInIteration: false
        isInLoop: false
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 240
      data:
        title: Start
        desc: Structured classifier inputs prepared by CRM before orchestration.
        type: start
        variables:
        - variable: recentMessages
          label: recentMessages
          type: text-input
          required: true
          max_length: 20000
          placeholder: JSON stringified chronological recent messages, latest user turn last
        - variable: conversationSummary
          label: conversationSummary
          type: text-input
          required: false
          max_length: 8000
          placeholder: Earlier conversation summary text
        - variable: journeySnapshot
          label: journeySnapshot
          type: text-input
          required: true
          max_length: 4000
          placeholder: JSON stringified journey snapshot
        - variable: allowedResourceHints
          label: allowedResourceHints
          type: text-input
          required: true
          max_length: 12000
          placeholder: JSON stringified resourceType and description hints
    - id: classifier_llm
      type: custom
      position:
        x: 430
        y: 240
      data:
        title: Classifier LLM
        desc: Multilingual, description-driven turn classifier that returns strict structured JSON only.
        type: llm
        model:
          provider: ''
          name: ''
          mode: chat
          completion_params:
            temperature: 0
        prompt_template:
        - role: system
          text: |
            You are a multilingual, description-driven intent classifier for a medical journey chatbot.

            This chatbot helps the patient move through a medical journey step by step.
            The journey starts with EXPLAIN_PROCESS and later moves into stages such as collecting medical inputs, recommendation, online consultation, and human handoff.
            Some stages have pre / active / post phases.

            Your task is only to classify the latest user turn.
            Use the provided context carefully and return the best intent label for this turn.

            What the inputs mean:
            - recentMessages: the most important local conversation context. Use it to understand what the user is responding to right now, especially whether the user is replying to the previous assistant message.
            - conversationSummary: compressed older context. Use it as background only. Do not let it override the latest turns unless the latest turns are ambiguous.
            - journeySnapshot: the patient's current journey position. Use it to understand what stage the conversation is currently in.
            - allowedResourceHints: the list of resource types that may be recognized in this turn. Never invent resource types outside this list.

            Intent definitions in journey terms:
            - faq:
              The user is asking for information that does not directly advance the current journey step and is not specifically asking for a journey walkthrough.
              This includes normal informational questions about timing, logistics, hospitals, service details, practical concerns, or general clarification.
              faq must always return targetResourceTypes as [].
            - process_explanation:
              The user is asking about the journey itself.
              This includes asking how the process works, why a step exists, what a step is for, what the overall flow looks like, or why the system is asking for something at this stage.
              Use this when the user is requesting explanation, not consenting to move forward.
              PROCESS_GUIDE may be targeted when allowed.
            - progression_request:
              The user wants to move the journey forward.
              This includes explicit requests to continue, proceed, start the next step, move on, or let the system guide the next step.
              It also includes short consent replies such as "okay", "sure", "go ahead", "yes please", or "show me the process" when those replies are clearly responding to the previous assistant invitation to proceed.
              Use this when the user is accepting the next step, not when they are asking for explanation.
              targetResourceTypes may be empty or may contain candidate next-step resources, but these are not explicitly requested resources.
            - resource_request:
              The user explicitly wants to open, use, review, submit, confirm, or otherwise act on a concrete resource.
              Prefer this over progression_request whenever a concrete resource is explicitly named.
              targetResourceTypes should represent the concrete resources explicitly requested by the user.
            - resource_status_question:
              The user is asking for the current state, progress, receipt status, or completion status of a concrete resource.
            - human_help_request:
              The user explicitly wants a human advisor or human takeover.
              HUMAN_HANDOFF may be targeted when allowed.

            Return strict JSON only with this exact shape:
            {
              "requestClass": "faq|process_explanation|progression_request|resource_request|resource_status_question|human_help_request",
              "targetResourceTypes": ["RESOURCE_TYPE"],
              "includeProgressionFollowUp": true
            }

            Rules:
            - Choose exactly one requestClass.
            - targetResourceTypes must only contain resource types from allowedResourceHints.
            - Only faq and process_explanation may set includeProgressionFollowUp to true.
            - For progression_request, targetResourceTypes represent candidate next-step resources, not explicitly requested resources.
            - If HUMAN_HANDOFF is not present in allowedResourceHints, human_help_request may still return an empty targetResourceTypes array.
            - process_explanation can still target PROCESS_GUIDE in later stages, but it is informational only and must not imply a journey rewind.
            - Base the classification on the latest user turn plus the nearby conversation context. Do not rely on raw keywords alone.
        - role: user
          text: |
            recentMessages:
            {{#start.recentMessages#}}

            conversationSummary:
            {{#start.conversationSummary#}}

            journeySnapshot:
            {{#start.journeySnapshot#}}

            allowedResourceHints:
            {{#start.allowedResourceHints#}}
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 1
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: normalize_classifier_output
      type: custom
      position:
        x: 780
        y: 240
      data:
        title: Normalize Classifier Output
        desc: Repair classifier JSON into the strict structured classifier contract.
        type: code
        code_language: python3
        code: |
          import json

          ALLOWED_REQUEST_CLASSES = {
              "faq",
              "process_explanation",
              "progression_request",
              "resource_request",
              "resource_status_question",
              "human_help_request",
          }

          def _extract_json_candidate(text: str) -> str:
              content = (text or "").strip()
              if not content:
                  return ""
              if "```" in content:
                  start_fence = content.find("```")
                  end_fence = content.rfind("```")
                  if start_fence != -1 and end_fence != -1 and end_fence > start_fence:
                      content = content[start_fence + 3:end_fence].strip()
                      if "\n" in content:
                          first_line, remainder = content.split("\n", 1)
                          if first_line.strip().lower() in {"json", "javascript"}:
                              content = remainder.strip()
              start = content.find("{")
              end = content.rfind("}")
              if start != -1 and end != -1 and end > start:
                  return content[start:end + 1]
              return content

          def _parse_json(value):
              if isinstance(value, (dict, list)):
                  return value
              if not isinstance(value, str):
                  return []
              text = value.strip()
              if not text:
                  return []
              try:
                  return json.loads(text)
              except Exception:
                  return []

          def _allowed_resource_types(resource_hints_text: str) -> set[str]:
              parsed = _parse_json(resource_hints_text)
              allowed = set()
              if isinstance(parsed, list):
                  for item in parsed:
                      if isinstance(item, dict):
                          resource_type = item.get("resourceType") or item.get("resource_type")
                          if isinstance(resource_type, str) and resource_type:
                              allowed.add(resource_type)
              return allowed

          def main(response_text: str, allowed_resource_hints: str) -> dict:
              allowed_resource_types = _allowed_resource_types(allowed_resource_hints)
              normalized = {
                  "requestClass": "faq",
                  "targetResourceTypes": [],
                  "includeProgressionFollowUp": False,
              }

              candidate = _extract_json_candidate(response_text)
              parsed = None
              try:
                  loaded = json.loads(candidate)
                  if isinstance(loaded, dict):
                      parsed = loaded
              except Exception:
                  parsed = None

              if isinstance(parsed, dict):
                  request_class = parsed.get("requestClass")
                  if isinstance(request_class, str) and request_class in ALLOWED_REQUEST_CLASSES:
                      normalized["requestClass"] = request_class

                  target_resource_types = parsed.get("targetResourceTypes")
                  if isinstance(target_resource_types, list):
                      filtered = []
                      for item in target_resource_types:
                          if isinstance(item, str) and item in allowed_resource_types and item not in filtered:
                              filtered.append(item)
                      normalized["targetResourceTypes"] = filtered

                  include_progression_follow_up = parsed.get("includeProgressionFollowUp")
                  if isinstance(include_progression_follow_up, bool):
                      normalized["includeProgressionFollowUp"] = include_progression_follow_up

              if normalized["requestClass"] == "faq":
                  normalized["targetResourceTypes"] = []

              if normalized["requestClass"] not in {"faq", "process_explanation"}:
                  normalized["includeProgressionFollowUp"] = False

              return {
                  "request_class": normalized["requestClass"],
                  "target_resource_types": json.dumps(normalized["targetResourceTypes"], ensure_ascii=True),
                  "include_progression_follow_up": "true" if normalized["includeProgressionFollowUp"] else "false",
              }
        outputs:
          request_class:
            type: string
            children: null
          target_resource_types:
            type: string
            children: null
          include_progression_follow_up:
            type: string
            children: null
        variables:
        - variable: response_text
          value_selector:
          - classifier_llm
          - text
          value_type: string
        - variable: allowed_resource_hints
          value_selector:
          - start
          - allowedResourceHints
          value_type: string
    - id: final_answer
      type: custom
      position:
        x: 1120
        y: 240
      data:
        title: Final Answer
        desc: Return the normalized classifier JSON unchanged.
        type: answer
        variables: []
        answer: |
          {"requestClass":"{{#normalize_classifier_output.request_class#}}","targetResourceTypes":{{#normalize_classifier_output.target_resource_types#}},"includeProgressionFollowUp":{{#normalize_classifier_output.include_progression_follow_up#}}}
    viewport:
      x: 0
      y: 0
      zoom: 0.9
