app:
  name: Medora AI Chatbot v3
  description: Backend-authoritative starter chatflow for Medora. Dify handles extraction, orchestration, retrieval, and response generation, while CRM backend owns policy decision and writeback truth.
  mode: advanced-chat
  icon: 🤖
  icon_background: '#FFEAD5'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-extraction
      source: start
      sourceHandle: source
      target: extraction_llm
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: extraction-context
      source: extraction_llm
      sourceHandle: source
      target: context_http
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: context-decide
      source: context_http
      sourceHandle: source
      target: decide_http
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: decide-risk-gate
      source: decide_http
      sourceHandle: source
      target: risk_gate
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: if-else
        isInIteration: false
        isInLoop: false
    - id: risk-crisis-response
      source: risk_gate
      sourceHandle: crisis
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: risk-normal-action-gate
      source: risk_gate
      sourceHandle: 'false'
      target: action_gate
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: if-else
        isInIteration: false
        isInLoop: false
    - id: action-hospitals
      source: action_gate
      sourceHandle: show_hospitals
      target: search_hospitals_http
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: hospitals-details
      source: search_hospitals_http
      sourceHandle: source
      target: hospital_details_http
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: details-response
      source: hospital_details_http
      sourceHandle: source
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: action-package
      source: action_gate
      sourceHandle: show_package
      target: list_packages_http
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: package-response
      source: list_packages_http
      sourceHandle: source
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: action-faq
      source: action_gate
      sourceHandle: faq_answer
      target: hospital_scope
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: if-else
        isInIteration: false
        isInLoop: false
    - id: action-direct-response
      source: action_gate
      sourceHandle: 'false'
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: scope-cosmetic
      source: hospital_scope
      sourceHandle: cosmetic
      target: faq_cosmetic_kr
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: knowledge-retrieval
        isInIteration: false
        isInLoop: false
    - id: scope-regular
      source: hospital_scope
      sourceHandle: 'false'
      target: faq_regular_kr
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: knowledge-retrieval
        isInIteration: false
        isInLoop: false
    - id: cosmetic-response
      source: faq_cosmetic_kr
      sourceHandle: source
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: knowledge-retrieval
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: regular-response
      source: faq_regular_kr
      sourceHandle: source
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: knowledge-retrieval
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: response-writeback
      source: response_composer
      sourceHandle: source
      target: writeback_http
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: writeback-answer
      source: writeback_http
      sourceHandle: source
      target: final_answer
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: answer
        isInIteration: false
        isInLoop: false
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 360
      data:
        title: Start
        desc: Collect CRM session metadata for the chatflow run.
        type: start
        variables:
        - variable: hospitalType
          label: hospitalType
          type: select
          required: true
          options:
          - COSMETIC
          - REGULAR
          default: COSMETIC
          max_length: 48
          placeholder: Select hospital type
        - variable: sessionId
          label: sessionId
          type: text-input
          required: true
          max_length: 255
          placeholder: CRM chatbot session id
    - id: extraction_llm
      type: custom
      position:
        x: 360
        y: 360
      data:
        title: Lightweight Extraction
        desc: Extract candidate signals only. Do not make final decisions here.
        type: llm
        model:
          provider: ''
          name: ''
          mode: chat
          completion_params:
            temperature: 0.1
        prompt_template:
        - role: system
          text: |
            Extract candidate signals from the latest user turn.

            Return JSON only:
            {
              "candidate_signals": {
                "possibleIntent": "string|null",
                "possibleRisk": "LOW|SENSITIVE|CRISIS|null",
                "affirmative": false,
                "negative": false,
                "mentionedBudget": "string|null",
                "topicHint": "string|null"
              }
            }
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: context_http
      type: custom
      position:
        x: 660
        y: 360
      data:
        title: Load CRM Context
        desc: Configure the internal URL and X-Internal-Secret after import.
        type: http-request
        method: post
        url: http://host.docker.internal:3000/api/v2/internal/ai-policy/context
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "version": "v1",
                "request_id": "context-{{#start.sessionId#}}",
                "session_id": "{{#start.sessionId#}}",
                "actor": "DIFY",
                "source_channel": "chatflow",
                "hospital_type": "{{#start.hospitalType#}}",
                "payload": {
                  "user_message": "{{#sys.query#}}"
                }
              }
        timeout:
          connect: 5
          read: 10
          write: 10
        retry_config:
          enabled: true
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: decide_http
      type: custom
      position:
        x: 980
        y: 360
      data:
        title: Backend Policy Decide
        desc: Authoritative decision source. Dify must not self-decide risk, recommendation, or handoff.
        type: http-request
        method: post
        url: http://host.docker.internal:3000/api/v2/internal/ai-policy/decide
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "version": "v1",
                "request_id": "decide-{{#start.sessionId#}}",
                "session_id": "{{#start.sessionId#}}",
                "actor": "DIFY",
                "source_channel": "chatflow",
                "hospital_type": "{{#start.hospitalType#}}",
                "payload": {
                  "user_message": "{{#sys.query#}}",
                  "candidate_signals": {{#extraction_llm.text#}}
                }
              }
        timeout:
          connect: 5
          read: 15
          write: 15
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: risk_gate
      type: custom
      position:
        x: 1280
        y: 220
      data:
        title: Safety Gate
        desc: Route crisis turns directly into safety-only response mode.
        type: if-else
        cases:
        - case_id: crisis
          id: crisis
          logical_operator: and
          conditions:
          - id: risk-level-crisis
            variable_selector:
            - decide_http
            - body
            - data
            - risk_level
            comparison_operator: is
            value: CRISIS
            varType: string
    - id: action_gate
      type: custom
      position:
        x: 1600
        y: 360
      data:
        title: Allowed Tool Gate
        desc: Only follow branches explicitly authorized by backend policy output.
        type: if-else
        cases:
        - case_id: show_hospitals
          id: show_hospitals
          logical_operator: and
          conditions:
          - id: next-action-hospitals
            variable_selector:
            - decide_http
            - body
            - data
            - next_action
            comparison_operator: is
            value: SHOW_HOSPITAL_RECOMMENDATIONS
            varType: string
        - case_id: show_package
          id: show_package
          logical_operator: and
          conditions:
          - id: next-action-package
            variable_selector:
            - decide_http
            - body
            - data
            - next_action
            comparison_operator: is
            value: SHOW_PACKAGE
            varType: string
        - case_id: faq_answer
          id: faq_answer
          logical_operator: and
          conditions:
          - id: next-action-faq
            variable_selector:
            - decide_http
            - body
            - data
            - next_action
            comparison_operator: is
            value: ANSWER_FAQ
            varType: string
    - id: hospital_scope
      type: custom
      position:
        x: 1920
        y: 620
      data:
        title: FAQ Scope
        desc: Bind FAQ datasets by hospitalType after import.
        type: if-else
        cases:
        - case_id: cosmetic
          id: cosmetic
          logical_operator: and
          conditions:
          - id: scope-cosmetic
            variable_selector:
            - start
            - hospitalType
            comparison_operator: is
            value: COSMETIC
            varType: string
    - id: faq_cosmetic_kr
      type: custom
      position:
        x: 2240
        y: 520
      data:
        title: Search FAQ Cosmetic
        desc: Attach FAQ_COSMETIC and PACKAGES datasets after import.
        type: knowledge-retrieval
        query_variable_selector:
        - sys
        - query
        query_attachment_selector: []
        dataset_ids: []
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 4
          score_threshold: 0.5
          reranking_enable: false
        metadata_filtering_mode: disabled
        vision:
          enabled: false
    - id: faq_regular_kr
      type: custom
      position:
        x: 2240
        y: 720
      data:
        title: Search FAQ Regular
        desc: Attach FAQ_REGULAR and PACKAGES datasets after import.
        type: knowledge-retrieval
        query_variable_selector:
        - sys
        - query
        query_attachment_selector: []
        dataset_ids: []
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 4
          score_threshold: 0.5
          reranking_enable: false
        metadata_filtering_mode: disabled
        vision:
          enabled: false
    - id: search_hospitals_http
      type: custom
      position:
        x: 1920
        y: 140
      data:
        title: Search Hospitals
        desc: Replace this starter URL with your MCP or backend hospital search endpoint.
        type: http-request
        method: post
        url: http://host.docker.internal:3000/api/v2/internal/mcp/search-hospitals
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "session_id": "{{#start.sessionId#}}",
                "policy_decision": {{#decide_http.body.data#}},
                "query": "{{#sys.query#}}"
              }
        timeout:
          connect: 5
          read: 15
          write: 15
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: hospital_details_http
      type: custom
      position:
        x: 2240
        y: 140
      data:
        title: Get Hospital Details
        desc: Optional enrichment step for shortlist cards. Keep this aligned to allowed_tools.
        type: http-request
        method: post
        url: http://host.docker.internal:3000/api/v2/internal/mcp/get-hospital-details
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "session_id": "{{#start.sessionId#}}",
                "shortlist": {{#search_hospitals_http.body#}}
              }
        timeout:
          connect: 5
          read: 15
          write: 15
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: list_packages_http
      type: custom
      position:
        x: 1920
        y: 360
      data:
        title: List Packages
        desc: Replace this starter URL with your MCP or backend package listing endpoint.
        type: http-request
        method: post
        url: http://host.docker.internal:3000/api/v2/internal/mcp/list-packages
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "session_id": "{{#start.sessionId#}}",
                "hospital_type": "{{#start.hospitalType#}}",
                "query": "{{#sys.query#}}"
              }
        timeout:
          connect: 5
          read: 15
          write: 15
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: response_composer
      type: custom
      position:
        x: 2600
        y: 360
      data:
        title: Response Composer
        desc: Generate final public JSON only. Respect backend next_action, risk, and allowed_tools.
        type: llm
        model:
          provider: ''
          name: ''
          mode: chat
          completion_params:
            temperature: 0.2
        prompt_template:
        - role: system
          text: |
            You are the final response layer for a backend-authoritative medical tourism chatbot.

            The backend policy decision is the source of truth.
            Do not invent tools, hospitals, packages, risk, or next actions outside the decision contract.

            Return strict JSON only with this shape:
            {
              "answer": "string",
              "intent": "FAQ|CONSULT|UNKNOWN|SAFETY|null",
              "topic": "string|null",
              "riskLevel": "NORMAL|SENSITIVE|CRISIS|null",
              "canAnswer": true,
              "nextAction": "ANSWER|CONSULT_CONVERSION|CREATE_CASE|REQUEST_DOCS|ESCALATE|SAFETY|null",
              "secondaryAction": "string|null",
              "responseMode": "string|null",
              "collectedFields": {},
              "missingItems": [],
              "recommendedProviders": [],
              "reasonCodes": [],
              "shortlist": [],
              "citations": []
            }

            Safety rules:
            - If backend risk is CRISIS, produce a safety-only response.
            - Never self-decide recommendation eligibility or human handoff.
            - Only use hospitals, packages, and FAQ facts returned by the allowed branches in this workflow.

            Mapping guidance:
            - internal next_action REQUEST_DOC_UPLOAD -> public nextAction REQUEST_DOCS
            - internal next_action SHOW_HOSPITAL_RECOMMENDATIONS -> public nextAction CONSULT_CONVERSION
            - internal next_action SHOW_PACKAGE -> public nextAction ANSWER unless backend instructs otherwise
        - role: user
          text: |
            User message: {{#sys.query#}}
            Hospital type: {{#start.hospitalType#}}

            CRM context:
            {{#context_http.body.data#}}

            Backend policy decision:
            {{#decide_http.body.data#}}

            FAQ retrieval cosmetic:
            {{#faq_cosmetic_kr.result#}}

            FAQ retrieval regular:
            {{#faq_regular_kr.result#}}

            Hospital search output:
            {{#search_hospitals_http.body#}}

            Hospital detail output:
            {{#hospital_details_http.body#}}

            Package output:
            {{#list_packages_http.body#}}
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 8
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: writeback_http
      type: custom
      position:
        x: 2940
        y: 360
      data:
        title: Backend Writeback
        desc: Final truth writeback should stay in CRM backend.
        type: http-request
        method: post
        url: http://host.docker.internal:3000/api/v2/internal/ai-policy/writeback
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "version": "v1",
                "request_id": "writeback-{{#start.sessionId#}}",
                "session_id": "{{#start.sessionId#}}",
                "actor": "DIFY",
                "source_channel": "chatflow",
                "hospital_type": "{{#start.hospitalType#}}",
                "payload": {
                  "assistant_message_id": "replace-after-import",
                  "idempotency_key": "{{#start.sessionId#}}:writeback:v1",
                  "policy_decision": {{#decide_http.body.data#}},
                  "tool_results": {
                    "faq_cosmetic": {{#faq_cosmetic_kr.result#}},
                    "faq_regular": {{#faq_regular_kr.result#}},
                    "search_hospitals": {{#search_hospitals_http.body#}},
                    "hospital_details": {{#hospital_details_http.body#}},
                    "packages": {{#list_packages_http.body#}}
                  },
                  "final_response_metadata": {{#response_composer.text#}}
                }
              }
        timeout:
          connect: 5
          read: 15
          write: 15
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: final_answer
      type: custom
      position:
        x: 3260
        y: 360
      data:
        title: Final Answer
        desc: Return the response-composer JSON unchanged.
        type: answer
        variables: []
        answer: '{{#response_composer.text#}}'
    viewport:
      x: 0
      y: 0
      zoom: 0.48
