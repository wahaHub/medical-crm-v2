    - id: response_composer
      type: custom
      position:
        x: 3200
        y: 360
      data:
        title: Response Composer
        desc: Generate final public JSON only. Backend decision is authoritative; tools and retrieval are grounding inputs.
        type: llm
        model:
          provider: langgenius/openai/openai
          name: gpt-4o
          mode: chat
          completion_params:
            temperature: 0.2
        prompt_template:
        - role: system
          text: |
            You are the final response layer for a backend-authoritative medical tourism chatbot.

            The backend policy decision is the source of truth.
            Do not invent risk, actions, hospitals, package facts, or human handoff decisions outside that contract.

            You may use grounded FAQ/package retrieval and tool outputs as facts.
            CRM context may be empty on LIGHT_DISCOVERY turns because cheap-path handling bypasses deeper retrieval/context loading.

            Map internal backend fields to the public chatbot contract:
            - risk_level CRISIS -> riskLevel CRISIS
            - risk_level HIGH_RISK -> riskLevel CRISIS
            - risk_level SENSITIVE -> riskLevel SENSITIVE
            - risk_level LOW -> riskLevel NORMAL
            - next_action ANSWER_FAQ -> nextAction ANSWER
            - next_action SHOW_PACKAGE -> nextAction ANSWER
            - next_action REQUEST_DOC_UPLOAD -> nextAction REQUEST_DOCS
            - next_action EXPLAIN_DOC_UPLOAD -> nextAction ANSWER
            - next_action EXPLAIN_CONSULT_PROCESS -> nextAction ANSWER
            - next_action EXPLORE_HOSPITAL_RECOMMENDATIONS -> nextAction ANSWER
            - next_action SHOW_HOSPITAL_RECOMMENDATIONS -> nextAction CONSULT_CONVERSION
            - next_action SAFETY_HANDOFF -> nextAction SAFETY

            Return strict JSON only with this exact shape:
            {
              "answer": "string",
              "intent": "FAQ|CONSULT|UNKNOWN|SAFETY|null",
              "resolvedIntent": "string|null",
              "topic": "string|null",
              "riskLevel": "NORMAL|SENSITIVE|CRISIS|null",
              "canAnswer": true,
              "nextAction": "ANSWER|CONSULT_CONVERSION|CREATE_CASE|REQUEST_DOCS|ESCALATE|SAFETY|null",
              "secondaryAction": "string|null",
              "responseMode": "string|null",
              "collectedFields": {
                "name": null,
                "email": null,
                "country": null,
                "conditionSummary": null,
                "budget": null
              },
              "missingItems": [],
              "recommendedProviders": [],
              "reasonCodes": [],
              "shortlist": [],
              "citations": [],
              "metadata": {
                "engagementMode": "LIGHT_DISCOVERY|QUALIFIED_EXPLORATION|DEEP_WORKFLOW|null",
                "internalNextAction": "string|null",
                "pathMode": "cheap_path|full_path|safety_path|null"
              }
            }

            Rules:
            - If backend engagement_mode is LIGHT_DISCOVERY, keep the answer lightweight and trust-building. Do not force conversion, shortlist promotion, or heavy workflow language.
            - If backend next_action is REQUEST_DOC_UPLOAD, ask for documents and set missingItems if grounded sources mention required materials.
            - If backend next_action is EXPLAIN_DOC_UPLOAD, explain the upload process without pretending an upload widget has already started.
            - If backend next_action is EXPLAIN_CONSULT_PROCESS, explain the consult workflow and keep the tone exploratory rather than forceful.
            - If backend next_action is EXPLORE_HOSPITAL_RECOMMENDATIONS, explain how hospital matching works and keep shortlist aligned to backend shortlist if one is present.
            - If backend next_action is SHOW_HOSPITAL_RECOMMENDATIONS, use backend shortlist and search_hospitals output together, but do not invent hospitals outside the tool output.
            - If backend next_action is SAFETY_HANDOFF, keep the response safety-only and direct the user toward human or emergency support without any commercial CTA.
            - If backend risk is HIGH_RISK or CRISIS, produce a safety-only response and do not promote services.
            - General FAQ retrieval is platform-wide guidance. Hospital-specific FAQ retrieval applies only to the active hospital in backend context.
            - Never present hospital-specific FAQ as a general rule for all hospitals.
            - If both general and hospital-specific FAQ are present, prioritize hospital-specific facts for the active hospital and use general FAQ as supporting context.
            - If retrieval is weak, keep the answer short and avoid hallucinating facts.
            - If grounded FAQ content exposes a category, use that as topic; otherwise use null.
            - Keep reasonCodes aligned to backend reason_codes.
            - Keep shortlist aligned to backend shortlist if present; otherwise use [].
            - Set metadata.engagementMode from backend engagement_mode.
            - Set metadata.internalNextAction from backend next_action.
            - Set metadata.pathMode to:
              - safety_path for HIGH_RISK/CRISIS handling
              - cheap_path for LIGHT_DISCOVERY
              - full_path otherwise
        - role: user
          text: |
            User message:
            {{#sys.query#}}

            Hospital type:
            {{#start.hospitalType#}}

            CRM context:
            {{#prompt_inputs_aggregator.ContextBody.output#}}

            Backend policy decision:
            {{#parse_decide_code.policy_decision#}}

            Candidate hospitals:
            {{#prompt_inputs_aggregator.HospitalsBody.output#}}

            General FAQ retrieval:
            {{#prompt_inputs_aggregator.GeneralFaqResult.output#}}

            Hospital-specific FAQ retrieval:
            {{#prompt_inputs_aggregator.HospitalFaqResult.output#}}

            Package cards:
            {{#prompt_inputs_aggregator.PackagesBody.output#}}
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 8
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: writeback_http
      type: custom
      position:
        x: 3040
        y: 360
      data:
        title: Backend Writeback
        desc: Final status / timeline writeback remains in CRM backend.
        type: http-request
        method: post
        url: '{{#env.crm_base_url#}}/api/v2/internal/ai-policy/writeback'
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: {{#env.internal_api_secret#}}
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "version": "v1",
                "request_id": "writeback-{{#start.sessionId#}}-{{#start.assistantMessageId#}}",
                "session_id": "{{#start.sessionId#}}",
                "actor": "DIFY",
                "source_channel": "chatflow",
                "hospital_type": "{{#start.hospitalType#}}",
                "payload": {
                  "assistant_message_id": "{{#start.assistantMessageId#}}",
                  "idempotency_key": "{{#start.sessionId#}}:{{#start.assistantMessageId#}}:v1",
                  "policy_decision": {{#parse_decide_code.writeback_policy_decision#}},
                  "tool_results": {},
                  "final_response_metadata": {{#response_composer.text#}}
                }
              }
        timeout:
          connect: 5
          read: 10
          write: 10
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: final_answer
      type: custom
      position:
        x: 3380
        y: 360
      data:
        title: Final Answer
        desc: Return the response-composer JSON unchanged.
        type: answer
        variables: []
        answer: '{{#response_composer.text#}}'
    viewport:
      x: 0
      y: 0
      zoom: 0.46
