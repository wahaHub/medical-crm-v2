      data:
        title: FAQ Category Resolver
        desc: Resolve the most relevant CRM FAQ category and whether hospital-aware FAQ is appropriate for this turn.
        type: llm
        model:
          provider: langgenius/openai/openai
          name: gpt-4o
          mode: chat
          completion_params:
            temperature: 0.1
        prompt_template:
        - role: system
          text: |
            You are selecting the most relevant CRM FAQ categories for retrieval.

            Return JSON only with this exact shape:
            {
              "categories": ["string"],
              "faqScope": "GENERAL_ONLY|HOSPITAL_AWARE"
            }

            Rules:
            - Use only category names that already exist in the provided category list.
            - Return 1 to 3 categories ordered from most to least relevant.
            - Return an empty array if none are relevant.
            - Set faqScope to HOSPITAL_AWARE only when the user is clearly asking about a currently active hospital.
            - If there is no active hospital id, prefer GENERAL_ONLY.
        - role: user
          text: |
            User message:
            {{#sys.query#}}

            Active hospital id:
            {{#parse_decide_code.active_hospital_id#}}

            Available CRM category list:
            {{#faq_categories_http.body#}}
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 4
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: parse_faq_category_code
      type: custom
      position:
        x: 2580
        y: 220
      data:
        title: Parse FAQ Category
        desc: Parse FAQ category resolver output and finalize FAQ scope gating with the active hospital context.
        type: code
        code_language: python3
        code: |
          import json

          def _read_available_categories(categories_body: str) -> list[str]:
              try:
                  payload = json.loads(categories_body or "{}")
              except Exception:
                  payload = {}

              categories = payload.get("categories")
              if not isinstance(categories, list):
                  return []

              names = []
              for item in categories:
                  if not isinstance(item, dict):
                      continue
                  name = item.get("name")
                  if isinstance(name, str) and name.strip():
                      names.append(name.strip())
              return names

          def main(resolver_text: str, active_hospital_id: str, categories_body: str) -> dict:
              parsed = {}
              try:
                  parsed = json.loads(resolver_text or "{}")
              except Exception:
                  parsed = {}

              available_categories = _read_available_categories(categories_body)
              allowed = set(available_categories)

              raw_categories = parsed.get("categories")
              normalized_categories = []
              if isinstance(raw_categories, list):
                  for value in raw_categories:
                      if isinstance(value, str) and value.strip():
                          normalized_categories.append(value.strip())
              else:
                  primary_category = parsed.get("primaryCategory")
                  if isinstance(primary_category, str) and primary_category.strip():
                      normalized_categories.append(primary_category.strip())

              filtered_categories = []
              seen = set()
              for category in normalized_categories:
                  if category not in allowed or category in seen:
                      continue
                  seen.add(category)
                  filtered_categories.append(category)
                  if len(filtered_categories) >= 3:
                      break

              scope_hint = parsed.get("faqScope")
              if scope_hint not in ("GENERAL_ONLY", "HOSPITAL_AWARE"):
                  scope_hint = "GENERAL_ONLY"

              faq_scope = "HOSPITAL_AWARE" if scope_hint == "HOSPITAL_AWARE" and active_hospital_id else "GENERAL_ONLY"

              return {
                  "categories": filtered_categories,
                  "faq_scope": faq_scope,
              }
        outputs:
          categories:
            type: array[string]
            children: null
          faq_scope:
            type: string
            children: null
        variables:
        - variable: resolver_text
          value_selector:
          - faq_category_resolver_llm
          - text
          value_type: string
        - variable: active_hospital_id
          value_selector:
          - parse_decide_code
          - active_hospital_id
          value_type: string
        - variable: categories_body
          value_selector:
          - faq_categories_http
          - body
          value_type: string
