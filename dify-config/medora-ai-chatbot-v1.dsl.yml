    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 340
      data:
        title: Start
        desc: Collect session metadata supplied by CRM backend.
        type: start
        variables:
        - variable: hospitalType
          label: hospitalType
          type: select
          required: true
          options:
          - COSMETIC
          - REGULAR
          default: COSMETIC
          max_length: 48
          placeholder: Select hospital type
        - variable: sessionId
          label: sessionId
          type: text-input
          required: true
          max_length: 255
          placeholder: CRM chatbot session id
        - variable: assistantMessageId
          label: assistantMessageId
          type: text-input
          required: true
          max_length: 255
          placeholder: Pre-generated CRM assistant message id
    - id: extraction_llm
      type: custom
      position:
        x: 360
        y: 340
      data:
        title: Lightweight Extraction
        desc: Non-authoritative candidate signal extraction.
        type: llm
        model:
          provider: langgenius/openai/openai
          name: gpt-4o
          mode: chat
          completion_params:
            temperature: 0.1
        prompt_template:
        - role: system
          text: |
            Extract non-authoritative candidate signals from the latest user turn.

            Return JSON only with this exact flat shape:
            {
              "possibleIntent": "ASK_FOR_RECOMMENDATION|REQUEST_DOC_UPLOAD|GENERAL_CONSULT|FAQ|null",
              "possibleRisk": "CRISIS|SENSITIVE|LOW|null",
              "affirmative": false,
              "negative": false,
              "mentionedBudget": "string|null",
              "topicHint": "string|null"
            }

            Rules:
            - Keep values null unless there is clear evidence.
            - Do not output nested wrappers.
            - This output is only a hint for the backend policy engine.
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: search_hospitals_http
      type: custom
      position:
        x: 2280
        y: 350
      data:
        title: Search Hospitals
        desc: Hospital grounding only for deeper recommendation/exploration turns. LIGHT_DISCOVERY must bypass this node.
        type: http-request
        method: post
        url: '{{#env.crm_base_url#}}/api/v2/internal/mcp/search-hospitals'
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: {{#env.internal_api_secret#}}
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "session_id": "{{#start.sessionId#}}",
                "query": "{{#sys.query#}}",
                "candidate_signals": {{#extraction_llm.text#}}
              }
        timeout:
          connect: 5
          read: 10
          write: 10
        retry_config:
          enabled: true
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: context_http
      type: custom
      position:
        x: 1310
        y: 340
      data:
        title: Load CRM Context
        desc: Full CRM truth source for summary, status, pending offer, and history. Cheap-path LIGHT_DISCOVERY turns should bypass this node.
        type: http-request
        method: post
        url: '{{#env.crm_base_url#}}/api/v2/internal/ai-policy/context'
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: {{#env.internal_api_secret#}}
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "version": "v1",
                "request_id": "context-{{#start.sessionId#}}",
                "session_id": "{{#start.sessionId#}}",
                "actor": "DIFY",
                "source_channel": "chatflow",
                "hospital_type": "{{#start.hospitalType#}}",
                "payload": {
                  "user_message": "{{#sys.query#}}"
                }
              }
        timeout:
          connect: 5
          read: 10
          write: 10
        retry_config:
          enabled: true
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: decide_http
      type: custom
      position:
        x: 680
        y: 340
      data:
        title: Resolve Engagement Mode + Backend Policy Decide
        desc: Authoritative backend gate. Engagement mode and risk resolve before any expensive hospital/package tool branching.
        type: http-request
        method: post
        url: '{{#env.crm_base_url#}}/api/v2/internal/ai-policy/decide'
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: {{#env.internal_api_secret#}}
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "version": "v1",
                "request_id": "decide-{{#start.sessionId#}}",
                "session_id": "{{#start.sessionId#}}",
                "actor": "DIFY",
                "source_channel": "chatflow",
                "hospital_type": "{{#start.hospitalType#}}",
                "payload": {
                  "user_message": "{{#sys.query#}}",
                  "candidate_signals": {{#extraction_llm.text#}}
                }
              }
        timeout:
          connect: 5
          read: 15
          write: 15
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: parse_decide_code
      type: custom
      position:
        x: 840
        y: 340
      data:
        title: Parse Decide Response
        desc: Parse the HTTP body string into field-level decision outputs for gates, prompts, and writeback.
        type: code
        code_language: python3
        code: |
          import json

          def main(decide_body: str) -> dict:
              envelope = {}
              try:
                  envelope = json.loads(decide_body or "{}")
              except Exception:
                  envelope = {}

              data = envelope.get("data") if isinstance(envelope, dict) else {}
              if not isinstance(data, dict):
                  data = {}

              writeback_plan = data.get("writeback_plan")
              if not isinstance(writeback_plan, dict):
                  writeback_plan = {}

              allowed_tools = data.get("allowed_tools")
              if not isinstance(allowed_tools, list):
                  allowed_tools = []

              active_hospital_context = data.get("active_hospital_context")
              if not isinstance(active_hospital_context, dict):
                  active_hospital_context = {}

              return {
                  "policy_decision": data,
                  "writeback_policy_decision": {
                      "engagement_mode": data.get("engagement_mode") or writeback_plan.get("engagement_mode"),
                      "writeback_depth": writeback_plan.get("writeback_depth"),
                      "next_action": data.get("next_action") or writeback_plan.get("next_action"),
                      "risk_level": data.get("risk_level") or writeback_plan.get("risk_level"),
                      "reason_codes": data.get("reason_codes") or writeback_plan.get("reason_codes") or [],
                      "prequalification_reason_codes": writeback_plan.get("prequalification_reason_codes") or [],
                      "shortlist": data.get("shortlist") or [],
                  },
                  "engagement_mode": data.get("engagement_mode"),
                  "risk_level": data.get("risk_level"),
                  "next_action": data.get("next_action"),
                  "active_hospital_id": active_hospital_context.get("hospital_id") or "",
                  "active_hospital_name": active_hospital_context.get("hospital_name") or "",
                  "allow_search_hospitals": "true" if "search_hospitals" in allowed_tools else "false",
                  "allow_list_packages": "true" if "list_packages" in allowed_tools else "false",
                  "allow_search_faq": "true" if "search_faq" in allowed_tools else "false",
              }
        outputs:
          policy_decision:
            type: object
            children: null
          writeback_policy_decision:
            type: object
            children: null
          engagement_mode:
            type: string
            children: null
          risk_level:
            type: string
            children: null
          next_action:
            type: string
            children: null
          active_hospital_id:
            type: string
            children: null
          active_hospital_name:
            type: string
            children: null
          allow_search_hospitals:
            type: string
            children: null
          allow_list_packages:
            type: string
            children: null
          allow_search_faq:
            type: string
            children: null
        variables:
        - variable: decide_body
          value_selector:
          - decide_http
          - body
          value_type: string
    - id: risk_gate
      type: custom
      position:
        x: 980
        y: 210
      data:
        title: Safety Gate
        desc: HIGH_RISK and CRISIS bypass commercial/tool branching and go straight to safety-governed response generation.
        type: if-else
        cases:
        - case_id: crisis
          id: crisis
          logical_operator: and
          conditions:
          - id: risk-crisis
            variable_selector:
            - parse_decide_code
            - risk_level
            comparison_operator: is
            value: CRISIS
            varType: string
        - case_id: high_risk
          id: high_risk
          logical_operator: and
          conditions:
          - id: risk-high-risk
            variable_selector:
            - parse_decide_code
            - risk_level
            comparison_operator: is
            value: HIGH_RISK
            varType: string
    - id: engagement_gate
      type: custom
      position:
        x: 980
        y: 470
      data:
        title: Engagement Gate
        desc: LIGHT_DISCOVERY stays on the cheap path. Qualified/deep modes continue into context, retrieval, and tool branching.
        type: if-else
        cases:
        - case_id: light_discovery
          id: light_discovery
          logical_operator: and
          conditions:
          - id: engagement-light
            variable_selector:
            - parse_decide_code
            - engagement_mode
            comparison_operator: is
