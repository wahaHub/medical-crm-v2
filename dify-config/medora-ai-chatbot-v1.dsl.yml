app:
  name: Medora AI Chatbot v5
  description: Backend-authoritative medical tourism chatflow with lightweight extraction, hospital candidate prefetch, CRM policy decisioning, FAQ/package grounding, and backend writeback.
  mode: advanced-chat
  icon: 🤖
  icon_background: '#FFEAD5'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-extraction
      source: start
      sourceHandle: source
      target: extraction_llm
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: extraction-search-hospitals
      source: extraction_llm
      sourceHandle: source
      target: search_hospitals_http
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: search-hospitals-context
      source: search_hospitals_http
      sourceHandle: source
      target: context_http
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: context-decide
      source: context_http
      sourceHandle: source
      target: decide_http
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: decide-risk-gate
      source: decide_http
      sourceHandle: source
      target: risk_gate
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: if-else
        isInIteration: false
        isInLoop: false
    - id: risk-crisis-response
      source: risk_gate
      sourceHandle: crisis
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: risk-normal-action-gate
      source: risk_gate
      sourceHandle: 'false'
      target: action_gate
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: if-else
        isInIteration: false
        isInLoop: false
    - id: action-show-package
      source: action_gate
      sourceHandle: show_package
      target: list_packages_http
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: list-packages-response
      source: list_packages_http
      sourceHandle: source
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: action-faq-scope
      source: action_gate
      sourceHandle: faq_answer
      target: faq_scope
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: if-else
        isInIteration: false
        isInLoop: false
    - id: action-direct-response
      source: action_gate
      sourceHandle: 'false'
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: scope-cosmetic
      source: faq_scope
      sourceHandle: cosmetic
      target: faq_cosmetic_kr
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: knowledge-retrieval
        isInIteration: false
        isInLoop: false
    - id: scope-regular
      source: faq_scope
      sourceHandle: 'false'
      target: faq_regular_kr
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: knowledge-retrieval
        isInIteration: false
        isInLoop: false
    - id: cosmetic-response
      source: faq_cosmetic_kr
      sourceHandle: source
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: knowledge-retrieval
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: regular-response
      source: faq_regular_kr
      sourceHandle: source
      target: response_composer
      targetHandle: target
      type: custom
      data:
        sourceType: knowledge-retrieval
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: response-writeback
      source: response_composer
      sourceHandle: source
      target: writeback_http
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: writeback-final
      source: writeback_http
      sourceHandle: source
      target: final_answer
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: answer
        isInIteration: false
        isInLoop: false
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 340
      data:
        title: Start
        desc: Collect session metadata supplied by CRM backend.
        type: start
        variables:
        - variable: hospitalType
          label: hospitalType
          type: select
          required: true
          options:
          - COSMETIC
          - REGULAR
          default: COSMETIC
          max_length: 48
          placeholder: Select hospital type
        - variable: sessionId
          label: sessionId
          type: text-input
          required: true
          max_length: 255
          placeholder: CRM chatbot session id
        - variable: assistantMessageId
          label: assistantMessageId
          type: text-input
          required: true
          max_length: 255
          placeholder: Pre-generated CRM assistant message id
    - id: extraction_llm
      type: custom
      position:
        x: 360
        y: 340
      data:
        title: Lightweight Extraction
        desc: Non-authoritative candidate signal extraction.
        type: llm
        model:
          provider: ''
          name: ''
          mode: chat
          completion_params:
            temperature: 0.1
        prompt_template:
        - role: system
          text: |
            Extract non-authoritative candidate signals from the latest user turn.

            Return JSON only with this exact flat shape:
            {
              "possibleIntent": "ASK_FOR_RECOMMENDATION|REQUEST_DOC_UPLOAD|GENERAL_CONSULT|FAQ|null",
              "possibleRisk": "CRISIS|SENSITIVE|LOW|null",
              "affirmative": false,
              "negative": false,
              "mentionedBudget": "string|null",
              "topicHint": "string|null"
            }

            Rules:
            - Keep values null unless there is clear evidence.
            - Do not output nested wrappers.
            - This output is only a hint for the backend policy engine.
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: search_hospitals_http
      type: custom
      position:
        x: 670
        y: 340
      data:
        title: Search Hospitals
        desc: Candidate pool prefetch for backend-authoritative shortlist selection.
        type: http-request
        method: post
        url: http://host.docker.internal:3001/api/v2/internal/mcp/search-hospitals
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_API_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "session_id": "{{#start.sessionId#}}",
                "query": "{{#sys.query#}}",
                "candidate_signals": {{#extraction_llm.text#}}
              }
        timeout:
          connect: 5
          read: 10
          write: 10
        retry_config:
          enabled: true
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: context_http
      type: custom
      position:
        x: 980
        y: 340
      data:
        title: Load CRM Context
        desc: CRM truth source for summary, status, pending offer, and history.
        type: http-request
        method: post
        url: http://host.docker.internal:3001/api/v2/internal/ai-policy/context
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_API_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "version": "v1",
                "request_id": "context-{{#start.sessionId#}}",
                "session_id": "{{#start.sessionId#}}",
                "actor": "DIFY",
                "source_channel": "chatflow",
                "hospital_type": "{{#start.hospitalType#}}",
                "payload": {
                  "user_message": "{{#sys.query#}}"
                }
              }
        timeout:
          connect: 5
          read: 10
          write: 10
        retry_config:
          enabled: true
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: decide_http
      type: custom
      position:
        x: 1310
        y: 340
      data:
        title: Backend Policy Decide
        desc: Authoritative decision source. Candidate hospitals are input only; shortlist is decided by backend.
        type: http-request
        method: post
        url: http://host.docker.internal:3001/api/v2/internal/ai-policy/decide
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_API_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "version": "v1",
                "request_id": "decide-{{#start.sessionId#}}",
                "session_id": "{{#start.sessionId#}}",
                "actor": "DIFY",
                "source_channel": "chatflow",
                "hospital_type": "{{#start.hospitalType#}}",
                "payload": {
                  "user_message": "{{#sys.query#}}",
                  "candidate_signals": {{#extraction_llm.text#}},
                  "candidate_hospitals": {{#search_hospitals_http.body.data#}}
                }
              }
        timeout:
          connect: 5
          read: 15
          write: 15
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: risk_gate
      type: custom
      position:
        x: 1620
        y: 210
      data:
        title: Safety Gate
        desc: CRISIS bypasses tool/rag branching and goes straight to safety response generation.
        type: if-else
        cases:
        - case_id: crisis
          id: crisis
          logical_operator: and
          conditions:
          - id: risk-crisis
            variable_selector:
            - decide_http
            - body
            - data
            - risk_level
            comparison_operator: is
            value: CRISIS
            varType: string
    - id: action_gate
      type: custom
      position:
        x: 1620
        y: 470
      data:
        title: Action Gate
        desc: Package path is explicit; FAQ path is grounded; other actions go direct to composer with backend contract.
        type: if-else
        cases:
        - case_id: show_package
          id: show_package
          logical_operator: and
          conditions:
          - id: next-action-package
            variable_selector:
            - decide_http
            - body
            - data
            - next_action
            comparison_operator: is
            value: SHOW_PACKAGE
            varType: string
        - case_id: faq_answer
          id: faq_answer
          logical_operator: and
          conditions:
          - id: next-action-faq
            variable_selector:
            - decide_http
            - body
            - data
            - next_action
            comparison_operator: is
            value: ANSWER_FAQ
            varType: string
    - id: faq_scope
      type: custom
      position:
        x: 1940
        y: 640
      data:
        title: FAQ Scope
        desc: Bind the correct FAQ dataset by hospitalType. Attach PACKAGES to both FAQ retrieval nodes.
        type: if-else
        cases:
        - case_id: cosmetic
          id: cosmetic
          logical_operator: and
          conditions:
          - id: scope-cosmetic
            variable_selector:
            - start
            - hospitalType
            comparison_operator: is
            value: COSMETIC
            varType: string
    - id: faq_cosmetic_kr
      type: custom
      position:
        x: 2280
        y: 560
      data:
        title: Search FAQ Cosmetic
        desc: After import, attach FAQ_COSMETIC and PACKAGES.
        type: knowledge-retrieval
        query_variable_selector:
        - sys
        - query
        query_attachment_selector: []
        dataset_ids: []
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 6
          score_threshold: 0.35
          reranking_enable: false
        metadata_filtering_mode: disabled
        vision:
          enabled: false
    - id: faq_regular_kr
      type: custom
      position:
        x: 2280
        y: 760
      data:
        title: Search FAQ Regular
        desc: After import, attach FAQ_REGULAR and PACKAGES.
        type: knowledge-retrieval
        query_variable_selector:
        - sys
        - query
        query_attachment_selector: []
        dataset_ids: []
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 6
          score_threshold: 0.35
          reranking_enable: false
        metadata_filtering_mode: disabled
        vision:
          enabled: false
    - id: list_packages_http
      type: custom
      position:
        x: 1940
        y: 410
      data:
        title: List Packages
        desc: Compact published package cards for soft CTA / package explanation flows.
        type: http-request
        method: post
        url: http://host.docker.internal:3001/api/v2/internal/mcp/list-packages
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_API_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "session_id": "{{#start.sessionId#}}",
                "hospital_type": "{{#start.hospitalType#}}",
                "query": "{{#sys.query#}}"
              }
        timeout:
          connect: 5
          read: 10
          write: 10
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: response_composer
      type: custom
      position:
        x: 2660
        y: 360
      data:
        title: Response Composer
        desc: Generate final public JSON only. Backend decision is authoritative; tools and retrieval are grounding inputs.
        type: llm
        model:
          provider: ''
          name: ''
          mode: chat
          completion_params:
            temperature: 0.2
        prompt_template:
        - role: system
          text: |
            You are the final response layer for a backend-authoritative medical tourism chatbot.

            The backend policy decision is the source of truth.
            Do not invent risk, actions, hospitals, package facts, or human handoff decisions outside that contract.

            You may use grounded FAQ/package retrieval and tool outputs as facts.

            Map internal backend fields to the public chatbot contract:
            - risk_level CRISIS -> riskLevel CRISIS
            - risk_level SENSITIVE -> riskLevel SENSITIVE
            - risk_level LOW -> riskLevel NORMAL
            - next_action ANSWER_FAQ -> nextAction ANSWER
            - next_action SHOW_PACKAGE -> nextAction ANSWER
            - next_action REQUEST_DOC_UPLOAD -> nextAction REQUEST_DOCS
            - next_action EXPLAIN_DOC_UPLOAD -> nextAction ANSWER
            - next_action EXPLAIN_CONSULT_PROCESS -> nextAction ANSWER
            - next_action EXPLORE_HOSPITAL_RECOMMENDATIONS -> nextAction CONSULT_CONVERSION
            - next_action SHOW_HOSPITAL_RECOMMENDATIONS -> nextAction CONSULT_CONVERSION
            - next_action SAFETY_HANDOFF -> nextAction SAFETY

            Return strict JSON only with this exact shape:
            {
              "answer": "string",
              "intent": "FAQ|CONSULT|UNKNOWN|SAFETY|null",
              "resolvedIntent": "string|null",
              "topic": "string|null",
              "riskLevel": "NORMAL|SENSITIVE|CRISIS|null",
              "canAnswer": true,
              "nextAction": "ANSWER|CONSULT_CONVERSION|CREATE_CASE|REQUEST_DOCS|ESCALATE|SAFETY|null",
              "secondaryAction": "string|null",
              "responseMode": "string|null",
              "collectedFields": {
                "name": null,
                "email": null,
                "country": null,
                "conditionSummary": null,
                "budget": null
              },
              "missingItems": [],
              "recommendedProviders": [],
              "reasonCodes": [],
              "shortlist": [],
              "citations": []
            }

            Rules:
            - If backend next_action is REQUEST_DOC_UPLOAD, ask for documents and set missingItems if grounded sources mention required materials.
            - If backend next_action is EXPLAIN_DOC_UPLOAD, explain the upload process without pretending an upload widget has already started.
            - If backend next_action is EXPLAIN_CONSULT_PROCESS, explain the consult workflow and keep the tone exploratory rather than forceful.
            - If backend next_action is EXPLORE_HOSPITAL_RECOMMENDATIONS, explain how hospital matching works and keep shortlist aligned to backend shortlist if one is present.
            - If backend next_action is SHOW_HOSPITAL_RECOMMENDATIONS, use backend shortlist and search_hospitals output together, but do not invent hospitals outside the tool output.
            - If backend risk is CRISIS, produce a safety-only response and do not promote services.
            - If retrieval is weak, keep the answer short and avoid hallucinating facts.
            - If grounded FAQ content exposes a category, use that as topic; otherwise use null.
            - Keep reasonCodes aligned to backend reason_codes.
            - Keep shortlist aligned to backend shortlist if present; otherwise use [].
        - role: user
          text: |
            User message:
            {{#sys.query#}}

            Hospital type:
            {{#start.hospitalType#}}

            CRM context:
            {{#context_http.body.data#}}

            Backend policy decision:
            {{#decide_http.body.data#}}

            Candidate hospitals:
            {{#search_hospitals_http.body.data#}}

            Cosmetic FAQ/package retrieval:
            {{#faq_cosmetic_kr.result#}}

            Regular FAQ/package retrieval:
            {{#faq_regular_kr.result#}}

            Package cards:
            {{#list_packages_http.body.data#}}
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 8
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        variables: []
    - id: writeback_http
      type: custom
      position:
        x: 3040
        y: 360
      data:
        title: Backend Writeback
        desc: Final status / timeline writeback remains in CRM backend.
        type: http-request
        method: post
        url: http://host.docker.internal:3001/api/v2/internal/ai-policy/writeback
        authorization:
          type: no-auth
          config: null
        headers: |-
          Content-Type: application/json
          X-Internal-Secret: REPLACE_ME_INTERNAL_API_SECRET
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: |
              {
                "version": "v1",
                "request_id": "writeback-{{#start.sessionId#}}-{{#start.assistantMessageId#}}",
                "session_id": "{{#start.sessionId#}}",
                "actor": "DIFY",
                "source_channel": "chatflow",
                "hospital_type": "{{#start.hospitalType#}}",
                "payload": {
                  "assistant_message_id": "{{#start.assistantMessageId#}}",
                  "idempotency_key": "{{#start.sessionId#}}:{{#start.assistantMessageId#}}:v1",
                  "policy_decision": {{#decide_http.body.data#}},
                  "tool_results": {
                    "candidate_hospitals": {{#search_hospitals_http.body.data#}},
                    "faq_cosmetic": {{#faq_cosmetic_kr.result#}},
                    "faq_regular": {{#faq_regular_kr.result#}},
                    "packages": {{#list_packages_http.body.data#}}
                  },
                  "final_response_metadata": {{#response_composer.text#}}
                }
              }
        timeout:
          connect: 5
          read: 10
          write: 10
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 500
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 2000
    - id: final_answer
      type: custom
      position:
        x: 3380
        y: 360
      data:
        title: Final Answer
        desc: Return the response-composer JSON unchanged.
        type: answer
        variables: []
        answer: '{{#response_composer.text#}}'
    viewport:
      x: 0
      y: 0
      zoom: 0.46
