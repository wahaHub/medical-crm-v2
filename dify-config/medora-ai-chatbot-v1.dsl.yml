app:
  name: Medora AI Chatbot v5
  description: Backend-authoritative medical tourism chatflow with lightweight extraction, engagement-mode-first routing, CRM policy decisioning, FAQ/package grounding, and backend writeback.
  mode: advanced-chat
  icon: 🤖
  icon_background: '#FFEAD5'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables:
  - id: env-crm-base-url
    name: crm_base_url
    selector:
    - env
    - crm_base_url
    value: REPLACE_ME_CRM_BASE_URL
    value_type: string
  - id: env-internal-api-secret
    name: internal_api_secret
    selector:
    - env
    - internal_api_secret
    value: REPLACE_ME_INTERNAL_API_SECRET
    value_type: secret
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-extraction
      source: start
      sourceHandle: source
      target: extraction_llm
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
        isInLoop: false
    - id: extraction-decide
      source: extraction_llm
      sourceHandle: source
      target: decide_http
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: risk-normal-engagement-gate
      source: risk_gate
      sourceHandle: 'false'
      target: engagement_gate
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: if-else
        isInIteration: false
        isInLoop: false
    - id: decide-parse
      source: decide_http
      sourceHandle: source
      target: parse_decide_code
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: parse-risk-gate
      source: parse_decide_code
      sourceHandle: source
      target: risk_gate
      targetHandle: target
